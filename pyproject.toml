[project]
name = "sassymcp"
dynamic = ["version"]
description = "Unified MCP server for cross-platform (Windows/macOS/Linux) desktop automation, Android device control, security auditing, web inspection, cross-session communication, GitHub operations, and AI workflow persona"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SassyMCP Contributors"}]

dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "psutil>=5.9.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "uvicorn>=0.30.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    # Windows-only UI automation (UIA backend + win32 window control).
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    # macOS display/UI introspection. Window control routes through osascript
    # (System Events) at runtime; AppKit/Quartz provide multi-monitor + DPI
    # detection. pyautogui pulls most of pyobjc on macOS; Cocoa is explicit
    # for the AppKit import in ui_automation._mac_monitors.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
reload = ["watchdog>=3.0.0"]
vision = ["pytesseract>=0.3.10"]
web = ["playwright>=1.40.0"]
overlay = ["pystray>=0.19.0", "keyboard>=0.13.5"]
desktop = ["pywebview>=5.0"]
all = [
    "pytesseract>=0.3.10",
    "playwright>=1.40.0",
    "watchdog>=3.0.0",
    "pystray>=0.19.0",
    "keyboard>=0.13.5",
    "pywebview>=5.0",
]

[project.scripts]
sassymcp = "sassymcp.server:main"
sassymcp-install = "sassymcp.install:main"
sassymcp-overlay = "sassymcp.overlay.app:main"
sassymcp-brain = "sassymcp.desktop.app:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth — bump only sassymcp/__init__.py
path = "sassymcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sassymcp"]

[tool.uv]
# python managed by .python-version file

[tool.pytest.ini_options]
markers = [
    "slow: long-running stress tests (use -m slow to run, deselected by default)"
]
# _DELETE_ is the safe-delete staging area and _backups holds pre-edit
# snapshots; both contain stale copies of real tests that must not be collected.
norecursedirs = ["_DELETE_", "_backups", ".venv", "build", "dist"]
