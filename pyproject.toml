[project]
name = "sassymcp"
dynamic = ["version"]
description = "Unified MCP server for cross-platform (Windows/macOS/Linux) desktop automation, Android device control, security auditing, web inspection, cross-session communication, GitHub operations, and AI workflow persona"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SassyMCP Contributors"}]

dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "psutil>=5.9.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "uvicorn>=0.30.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    # Windows-only UI automation (UIA backend + win32 window control).
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    # macOS display/UI introspection. Window control routes through osascript
    # (System Events) at runtime; AppKit/Quartz provide multi-monitor + DPI
    # detection. pyautogui pulls most of pyobjc on macOS; Cocoa is explicit
    # for the AppKit import in ui_automation._mac_monitors.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    # pyautogui's X11 backend on Linux needs python-xlib (import: Xlib). It was
    # a transitive pin until uv 0.8.x stopped resolving it from pyautogui's
    # metadata; declare it explicitly so the Linux UI-automation path keeps
    # working and security re-locks (e.g. the pydantic-settings bump) don't
    # silently drop it.
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
reload = ["watchdog>=3.0.0"]
vision = ["pytesseract>=0.3.10"]
web = ["playwright>=1.40.0"]
all = [
    "pytesseract>=0.3.10",
    "playwright>=1.40.0",
    "watchdog>=3.0.0",
]

[project.scripts]
sassymcp = "sassymcp.server:main"
sassymcp-install = "sassymcp.install:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth — bump only sassymcp/__init__.py
path = "sassymcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sassymcp"]

[tool.uv]
# python managed by .python-version file

# Security floor for a transitive dep (pulled in via mcp): pydantic-settings
# < 2.14.2 has a symlink-traversal flaw in NestedSecretsSettingsSource that
# reads files outside secrets_dir and bypasses secrets_dir_max_size
# (Dependabot #38, GHSA medium). It's not a direct dependency, so constrain
# the resolution floor rather than adding it to [project].dependencies.
constraint-dependencies = ["pydantic-settings>=2.14.2"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running stress tests (use -m slow to run, deselected by default)"
]
