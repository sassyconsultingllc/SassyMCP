name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    # Allow manual builds against any branch without tagging. The build jobs
    # produce artifacts; the release/publish jobs only fire on real tag pushes.

permissions:
  contents: write   # needed for gh release create

env:
  # Opt in to Node 24 for all JavaScript actions in this workflow. Github
  # deprecated Node 20 in Sept 2025; node24 becomes the default June 2026.
  # Setting this now silences the warnings and confirms forward-compat.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-exe:
    name: Build sassymcp.exe (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh   # windows-latest defaults to pwsh; making it explicit
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Read version from sassymcp/__init__.py
        id: version
        run: |
          $content = Get-Content sassymcp/__init__.py -Raw
          if ($content -match '__version__\s*=\s*"([^"]+)"') {
            $v = $Matches[1]
            "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version: $v"
          } else {
            Write-Error "Could not parse __version__"
            exit 1
          }

      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $sourceVersion = "${{ steps.version.outputs.value }}"
          if ($tagVersion -ne $sourceVersion) {
            Write-Error "Tag $tagVersion does not match __version__ $sourceVersion. Bump sassymcp/__init__.py before tagging."
            exit 1
          }

      - name: Install dependencies + PyInstaller
        # Install base deps only — the [all] extras (playwright,
        # pytesseract, watchdog) are lazy-imported with graceful
        # fallbacks, so excluding them keeps the shipped exe at ~35 MB
        # instead of ~73 MB. Users who need OCR or playwright
        # screenshots install those into their own Python.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Build sassymcp.exe via PyInstaller
        run: |
          pyinstaller --clean --noconfirm sassymcp.spec

      - name: Verify exe exists
        run: |
          if (-not (Test-Path dist\sassymcp.exe)) {
            Write-Error "PyInstaller did not produce dist\sassymcp.exe"
            exit 1
          }
          $size = (Get-Item dist\sassymcp.exe).Length / 1MB
          Write-Host "Built dist\sassymcp.exe ($([math]::Round($size, 1)) MB)"

      - name: Smoke-test exe
        run: |
          # argparse exits 0 after printing --help, which is the success signal.
          $output = & .\dist\sassymcp.exe --help 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "sassymcp.exe --help exited $LASTEXITCODE; output: $output"
            exit 1
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: sassymcp-exe
          path: dist/sassymcp.exe
          if-no-files-found: error

  build-dxt:
    name: Build sassymcp.dxt
    runs-on: windows-latest
    needs: build-exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: sassymcp-exe
          path: .

      - name: Build MCPB (+ byte-identical .dxt)
        # build-mcpb.ps1 packs the bundle via the official @anthropic-ai/mcpb
        # CLI (needs npx, hence setup-node above) and emits BOTH dist\*.mcpb and
        # a byte-identical dist\*.dxt. It auto-syncs mcpb/manifest.json's version
        # to sassymcp/__init__.py. Renamed from the old build-dxt.ps1 (now in
        # scripts/_DELETE_/), which this job still referenced — so every release
        # since the rename failed at "scripts/build-dxt.ps1 not recognized".
        run: |
          & scripts/build-mcpb.ps1

      - name: Verify DXT exists
        run: |
          $dxt = Get-ChildItem dist\sassymcp-v*.dxt | Select-Object -First 1
          if (-not $dxt) {
            Write-Error "build-dxt.ps1 did not produce a DXT file"
            exit 1
          }
          Write-Host "Built $($dxt.Name) ($([math]::Round($dxt.Length / 1MB, 1)) MB)"

      - name: Upload DXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: sassymcp-dxt
          path: dist/sassymcp-v*.dxt
          if-no-files-found: error

  build-vsix:
    name: Build sassymcp-vscode-*.vsix
    runs-on: ubuntu-latest
    # No `needs:` — the VSIX doesn't depend on the .exe artifact. Build in
    # parallel with build-exe to shave a few minutes off the pipeline.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sassymcp-vscode/package-lock.json

      - name: Sync sassymcp-vscode/package.json version with __init__.py
        # The package.json version drives the produced .vsix filename. Keep
        # it locked to the canonical __version__ so the VSIX, the DXT, and
        # the GitHub release tag all carry the same string.
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re,sys; m=re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("sassymcp/__init__.py").read()); print(m.group(1)) if m else sys.exit("could not parse __version__")')
          echo "Syncing sassymcp-vscode/package.json to version $version"
          # Update only the top-level "version" field. jq preserves formatting
          # well enough for our purposes; install jq if not present (it is on
          # ubuntu-latest by default but be explicit).
          which jq >/dev/null || sudo apt-get update && sudo apt-get install -y jq
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' sassymcp-vscode/package.json > "$tmp"
          mv "$tmp" sassymcp-vscode/package.json
          # Show the change for the run log
          grep '"version"' sassymcp-vscode/package.json | head -1

      - name: Install extension dependencies
        working-directory: sassymcp-vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: sassymcp-vscode
        run: npm run compile

      - name: Ensure dist/ exists
        # vsce --out path must be a real directory or vsce errors. Repo root.
        run: mkdir -p dist

      - name: Package VSIX
        working-directory: sassymcp-vscode
        run: npx --yes @vscode/vsce package --out ../dist/

      - name: Verify VSIX exists
        run: |
          ls -la dist/
          if ! ls dist/sassymcp-*.vsix 1> /dev/null 2>&1; then
            echo "vsce did not produce a VSIX"
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sassymcp-vsix
          path: dist/sassymcp-*.vsix
          if-no-files-found: error

  build-macos:
    name: Build sassymcp (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Build each arch on a native runner — PyInstaller can't cross-compile, and
    # building x86_64 on an Intel runner + arm64 on an Apple Silicon runner is
    # what lets us lipo a true universal2 binary in build-macos-universal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13   # Intel (x86_64)
            arch: x86_64
          - runner: macos-14   # Apple Silicon (arm64)
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          src=$(python3 -c 'import re,sys; m=re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("sassymcp/__init__.py").read()); print(m.group(1)) if m else sys.exit("could not parse __version__")')
          if [ "$tag" != "$src" ]; then
            echo "Tag $tag does not match __version__ $src. Bump sassymcp/__init__.py before tagging."
            exit 1
          fi

      - name: Install dependencies + PyInstaller
        # Base deps only — the [all] extras (playwright/pytesseract/watchdog)
        # are lazy-imported with graceful fallbacks, mirroring build-exe. The
        # spec is platform-aware: pyobjc is pulled on macOS via sys_platform
        # markers, pywinauto is excluded.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Confirm runner arch
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.arch }})"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Build sassymcp via PyInstaller
        run: pyinstaller --clean --noconfirm sassymcp.spec

      - name: Verify + smoke-test
        run: |
          set -euo pipefail
          test -f dist/sassymcp || { echo "PyInstaller did not produce dist/sassymcp"; exit 1; }
          chmod +x dist/sassymcp
          file dist/sassymcp
          # argparse exits 0 after --help — the success signal.
          ./dist/sassymcp --help >/dev/null
          echo "OK (${{ matrix.arch }})"

      - name: Upload per-arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: sassymcp-macos-${{ matrix.arch }}
          path: dist/sassymcp
          if-no-files-found: error

  build-macos-universal:
    name: Merge macOS universal2 binary
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Download x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: sassymcp-macos-x86_64
          path: x86_64

      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: sassymcp-macos-arm64
          path: arm64

      - name: lipo into a universal2 binary
        run: |
          set -euo pipefail
          mkdir -p dist
          lipo -create -output dist/sassymcp-macos x86_64/sassymcp arm64/sassymcp
          chmod +x dist/sassymcp-macos
          echo "=== archs ==="
          lipo -archs dist/sassymcp-macos
          file dist/sassymcp-macos
          lipo -archs dist/sassymcp-macos | grep -q x86_64
          lipo -archs dist/sassymcp-macos | grep -q arm64
          echo "universal2 OK ($(du -h dist/sassymcp-macos | cut -f1))"

      - name: Smoke-test universal binary
        # macos-latest is arm64; the binary runs its arm64 slice natively.
        run: |
          set -euo pipefail
          ./dist/sassymcp-macos --help >/dev/null
          echo "universal --help OK"

      # NOTE: this binary is UNSIGNED. On download, Gatekeeper quarantines it
      # ("unidentified developer"); users clear it with `xattr -dr
      # com.apple.quarantine sassymcp-macos` or right-click → Open. To ship
      # signed+notarized, add an Apple Developer ID cert + notarytool step here
      # (needs an Apple Developer account + secrets).
      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: sassymcp-macos
          path: dist/sassymcp-macos
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-exe, build-dxt, build-vsix, build-macos-universal]
    # Only fire on real tag pushes; workflow_dispatch builds the artifacts
    # for verification but never publishes a release.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded artifacts
        run: find release-artifacts -type f

      - name: Look up release notes for this version
        id: notes
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          notes_file="docs/releases/${version}.md"
          if [ -f "$notes_file" ]; then
            echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
            echo "Using $notes_file"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
            echo "No docs/releases/${version}.md — falling back to auto-generated notes"
          fi

      - name: Create GitHub Release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ steps.notes.outputs.notes_file }}" ]; then
            gh release create "${{ github.ref_name }}" \
              release-artifacts/sassymcp-exe/sassymcp.exe \
              release-artifacts/sassymcp-macos/sassymcp-macos \
              release-artifacts/sassymcp-dxt/*.dxt \
              release-artifacts/sassymcp-vsix/*.vsix \
              --title "${{ github.ref_name }}" \
              --notes-file "${{ steps.notes.outputs.notes_file }}"
          else
            gh release create "${{ github.ref_name }}" \
              release-artifacts/sassymcp-exe/sassymcp.exe \
              release-artifacts/sassymcp-macos/sassymcp-macos \
              release-artifacts/sassymcp-dxt/*.dxt \
              release-artifacts/sassymcp-vsix/*.vsix \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  publish-vsix:
    name: Publish VSIX to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: build-vsix
    # GitHub Actions does not allow `secrets.*` in job-level `if`. Gate this
    # job on a repository VARIABLE (Settings -> Variables) instead. Set
    # PUBLISH_VSIX=true once VSCE_PAT is configured in repo secrets. Also
    # require a real tag — workflow_dispatch builds shouldn't auto-publish.
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_VSIX == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: sassymcp-vsix
          path: dist

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is empty; cannot publish."
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath dist/sassymcp-*.vsix
